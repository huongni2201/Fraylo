name: Release Fraylo

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/Fraylo.Web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: src/Fraylo.Web
      - name: Kiểm thử web
        run: pnpm --dir src/Fraylo.Web test
      - name: Build Release và kiểm thử luồng chính
        shell: pwsh
        run: |
          dotnet build Fraylo.sln -c Release -m:1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --no-build -c Release --project tests/Fraylo.Desktop.SmokeChecks -- workflow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --no-build -c Release --project tests/Fraylo.Desktop.SmokeChecks -- reference-video
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --no-build -c Release --project tests/Fraylo.Publishing.SmokeChecks
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Cài Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Cấp khóa ký cập nhật
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) { throw "Thiếu secret RELEASE_SIGNING_KEY (PKCS#8 base64 của release-signing.key)." }
          $dir = Join-Path $env:USERPROFILE "Fraylo-keys"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content (Join-Path $dir "release-signing.key") $env:RELEASE_SIGNING_KEY -NoNewline
      - name: Đóng gói
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          UPDATE_BASE_URL: ${{ secrets.UPDATE_BASE_URL }}
        run: scripts/package-release.ps1 -Version "${{ github.ref_name }}".TrimStart('v')
      - name: Đẩy lên Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $r = "dist/releases"
          # manifest.json đẩy cuối và không cache: app chỉ thấy bản mới khi zip đã sẵn sàng.
          foreach ($f in Get-ChildItem "$r/Fraylo-*-win-x64.zip", "$r/Fraylo-Setup-v*.exe") {
            aws s3 cp $f.FullName "s3://$env:R2_BUCKET/$($f.Name)" --endpoint-url $env:R2_ENDPOINT
            if ($LASTEXITCODE) { throw "upload $($f.Name) thất bại" }
          }
          aws s3 cp "$r/manifest.json" "s3://$env:R2_BUCKET/manifest.json" --endpoint-url $env:R2_ENDPOINT --cache-control "no-cache" --content-type application/json
          if ($LASTEXITCODE) { throw "upload manifest.json thất bại" }
